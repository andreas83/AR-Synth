name: ar_synth
description: "Camera hand-gesture virtual piano and synthesizer built with Flutter."
publish_to: "none"
version: 1.0.0+1

environment:
  # camera 0.11.3+ (pulled in by hand_landmarker) requires Dart >= 3.9,
  # which ships with Flutter >= 3.35.
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # Audio engine: low-latency oscillator synthesis + sample playback (FFI/SoLoud).
  flutter_soloud: ^2.1.0

  # Camera preview + image stream (feeds the hand tracker).
  camera: ^0.11.0

  # MediaPipe Hand Landmarker (Android, native JNI bridge, model bundled).
  hand_landmarker: ^2.1.2

  # ML Kit face detection (Android) for optional face-expression modulation.
  # Shares the same camera image stream as the hand tracker.
  google_mlkit_face_detection: ^0.14.0

  # Runtime permissions (camera).
  permission_handler: ^11.3.1

  # Simple state management.
  provider: ^6.1.2

  # Persist user settings.
  shared_preferences: ^2.3.2

  # Keep the screen awake while playing.
  wakelock_plus: ^1.2.8

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/samples/
