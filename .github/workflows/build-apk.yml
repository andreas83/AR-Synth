name: Build APK

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to publish releases

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Must be >= 3.35 (Dart >= 3.9) for camera/hand_landmarker.
          flutter-version: "3.44.9"
          cache: true

      - name: Print toolchain versions
        run: flutter --version

      # Version every build off the run number so the in-app updater can tell
      # builds apart: 1.0.<run_number>.
      - name: Compute version
        id: version
        run: echo "name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      # Signed with the committed shared keystore (android/app/arsynth-shared.jks)
      # so every build has the same signature and updates install over each other.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }}

      - name: Rename release APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             dist/ar-synth-${{ steps.version.outputs.name }}.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ar-synth-apks
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            dist/ar-synth-${{ steps.version.outputs.name }}.apk

      # Publish a Release on the default branch only. The in-app updater polls
      # /releases/latest, so this is what makes updates reach the device.
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: AR Synth ${{ steps.version.outputs.name }}
          body: |
            Automated build from `${{ github.sha }}`.

            ${{ github.event.head_commit.message }}
          files: dist/ar-synth-${{ steps.version.outputs.name }}.apk
          make_latest: true
